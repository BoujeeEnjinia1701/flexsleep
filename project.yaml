pitch: >-
  A flat-pack pod of folding flame-retardant polypropylene panels that one person sets round a field cot: two zigzag
  halves, 1.2 m high, open at the top and the foot end, give a lying patient visual privacy and a physical boundary
  against contact and sideways splashes, and open at the head in seconds for resuscitation. Built on the shared Flex
  platform; supports IPC practice in surge wards and shelters. A boundary, not a barrier and not a support.
problem: >-
  Overcrowded emergency care puts patients in open shared sleeping space with no privacy and open contact and droplet
  paths between beds. Field hospital operators, shelter managers and humanitarian health teams need a light, foldable
  micro-boundary round each cot that keeps patients in view and in reach.
